name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npm run build
      - name: Validate SEO structure and internal links
        run: npm run check
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Run the PDF tools end to end
        run: npm run fixtures && node scripts/e2e.mjs .tmp/fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist
          retention-days: 7
